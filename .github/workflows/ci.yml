# PaddleSense CI — TESTING.md §1 honored: unit + DB suites are network-free.
# Three jobs mirror the three test surfaces: web app, DB invariants (real
# Postgres + pgvector), prediction service (Python/TabPFN, fixtures only).

name: ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/test-db.mjs provisions its own throwaway pgvector container
      # on host port 54329 — no workflow service container here, or the two
      # fight over the port (docker exit 125, measured on the first runs).
      - run: npm run test:db

  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/predict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/predict/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest
